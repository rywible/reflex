name: CI Deep Lane

on:
  schedule:
    - cron: "0 2 * * 1" # weekly, Monday 02:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-lane:
    name: Deep lane (xtask check-deep)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run xtask check-deep
        run: cargo xtask check-deep

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-checks-deep
          path: evidence/checks/
          if-no-files-found: ignore
