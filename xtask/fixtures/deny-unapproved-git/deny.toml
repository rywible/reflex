# Hermetic fixture: unapproved Git source must be rejected by cargo-deny.
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
allow = ["MIT", "Apache-2.0"]
