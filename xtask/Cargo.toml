[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
atomic-write-file = "0.3.0"
cpu-time = "1.0"
nix = { version = "0.31.3", default-features = false, features = ["fs", "mount", "process", "sched", "signal"] }
reflex = { path = "../crates/reflex", features = ["internal-experiments"] }
reflex-bitvec = { path = "../crates/reflex-bitvec" }
reflex-bundle = { path = "../crates/reflex-bundle" }
reflex-lean = { path = "../crates/reflex-lean" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }

[lints]
workspace = true
