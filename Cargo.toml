[workspace]
resolver = "3"
members = [
    "crates/*",
    "bins/*",
    "domains/*",
    "xtask",
    "tests",
    "fuzz",
]

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(reflex_loom)", "cfg(turmoil)"] }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"
authors = ["Ryan Wible <ryan@ryanwible.com>"]

[workspace.dependencies]
# Workspace crates
reflex-types = { path = "crates/reflex-types" }
reflex-canonical = { path = "crates/reflex-canonical" }
reflex-cas = { path = "crates/reflex-cas" }
reflex-ledger = { path = "crates/reflex-ledger" }
reflex-meta = { path = "crates/reflex-meta" }
reflex-dataset = { path = "crates/reflex-dataset" }
reflex-domain = { path = "crates/reflex-domain" }
reflex-protocol = { path = "crates/reflex-protocol" }
reflex-domain-host = { path = "crates/reflex-domain-host" }
reflex-runtime = { path = "crates/reflex-runtime" }
reflex-search = { path = "crates/reflex-search" }
reflex-ml-core = { path = "crates/reflex-ml-core" }
reflex-ml-micro = { path = "crates/reflex-ml-micro" }
reflex-ml-burn = { path = "crates/reflex-ml-burn" }
reflex-training = { path = "crates/reflex-training" }
reflex-eval = { path = "crates/reflex-eval" }
reflex-knowledge = { path = "crates/reflex-knowledge" }
reflex-economics = { path = "crates/reflex-economics" }
reflex-engine = { path = "crates/reflex-engine" }
reflex-research-graph = { path = "crates/reflex-research-graph" }
reflex-scheduler = { path = "crates/reflex-scheduler" }
reflex-analytics = { path = "crates/reflex-analytics" }
reflex-report = { path = "crates/reflex-report" }
reflex-observability = { path = "crates/reflex-observability" }
reflex-bench = { path = "crates/reflex-bench" }

# Domains
reflex-domain-bitvec = { path = "domains/reflex-domain-bitvec" }
reflex-domain-wrela = { path = "domains/reflex-domain-wrela" }
reflex-domain-lean = { path = "domains/reflex-domain-lean" }

# External crates
tokio = { version = "~1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
axum = { version = "0.8.9" }
prost = { version = "0.14.4" }
prost-types = { version = "0.14.4" }
blake3 = { version = "1.5", features = ["serde"] }
sha2 = { version = "0.10" }
hex = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
toml = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = { version = "0.1" }
bytes = { version = "1.9", features = ["serde"] }
futures = { version = "0.3" }
futures-util = { version = "0.3" }
clap = { version = "4.5", features = ["derive", "env"] }
crc32c = { version = "0.6" }
smallvec = { version = "1.13", features = ["serde"] }
arc-swap = { version = "1.7" }
rand = { version = "0.8" }
rand_chacha = { version = "0.3" }
thiserror = { version = "2.0" }
tempfile = { version = "3.16" }
proptest = { version = "1.6" }
loom = { version = "=0.7.2" }
turmoil = { version = "=0.7.2" }
criterion = { version = "0.8.2", features = ["async_tokio"] }
memmap2 = { version = "0.9" }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

# ML & Analytics
# Burn pinned to 0.22.0-pre.2 per ADR-0006 (deviation from plan 0.21.x line).
burn = { version = "=0.22.0-pre.2", default-features = false, features = ["std", "train", "autodiff", "flex", "safetensors"] }
burn-hip = { version = "=0.22.0-pre.2" }
# Exact analytics line per ADR-0013; changes require another ADR.
arrow = { version = "=58.4.0", features = ["ffi"] }
parquet = { version = "=58.4.0" }
datafusion = { version = "=54.1.0", features = ["parquet"] }
safetensors = { version = "0.5" }

# Observability & profiling (wired into reflex-observability in a later wave; ADR-0010).
pprof = { version = "0.15", default-features = false }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false }
quick-xml = "0.41.0"
