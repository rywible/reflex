[experiment]
name = "bitvec-tutorial"
domain = "bitvec-v1"
generations = 2
seeds = [42]

[search]
algorithm = "best-first-and-or-v1"
action_budget = 100
node_budget = 1000
exploration_uniform = 0.1

[training]
model_type = "micro-mlp"
input_dim = 24
hidden_dim = 16
epochs = 30
learning_rate = 0.05
weight_decay = 0.0001
